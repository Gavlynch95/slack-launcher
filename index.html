<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Slack Launcher</title>
  <style>
    :root {
      --rail: 300px;
      --titlebar: 0px;
      --bg: #f4f2ee;
      --panel: #ffffff;
      --ink: #1f2933;
      --muted: #667085;
      --soft: #e5e1d8;
      --line: #d8d5cf;
      --dark: #14171c;
      --dark-2: #20242b;
      --dark-3: #2b3038;
      --primary: #0f766e;
      --primary-2: #14b8a6;
      --compare: #b45309;
      --danger: #dc2626;
      --good: #059669;
      --grid: #0f766e;
      --plus: #7c3aed;
      --shadow: 0 18px 50px rgba(31, 41, 51, 0.16);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      height: 100vh;
      overflow: hidden;
      color: var(--ink);
      background: var(--bg);
      font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-app-region: drag;
    }

    button, input, select { font: inherit; }
    button { -webkit-app-region: no-drag; }

    .app {
      height: 100vh;
      display: grid;
      grid-template-columns: var(--rail) minmax(0, 1fr);
      overflow: hidden;
    }

    .rail {
      background: var(--dark);
      color: #f8fafc;
      border-right: 1px solid #05070a;
      display: flex;
      flex-direction: column;
      min-width: 0;
      -webkit-app-region: no-drag;
    }

    .brand {
      padding: 32px 14px 10px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      -webkit-app-region: drag;
    }
    .brand-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .brand h1 {
      margin: 0;
      font-size: 16px;
      letter-spacing: 0;
    }
    .rail-body {
      overflow-y: auto;
      padding: 10px;
    }

    .section-head {
      margin: 12px 2px 6px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      color: #c7cdd5;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0;
    }

    .workspace-grid {
      display: grid;
      gap: 7px;
    }

    .workspace-card {
      width: 100%;
      border: 1px solid rgba(255,255,255,0.1);
      background: var(--dark-2);
      color: #f8fafc;
      border-radius: 8px;
      padding: 9px;
      text-align: left;
      cursor: pointer;
      display: grid;
      gap: 5px;
    }
    .workspace-card:hover { background: var(--dark-3); }
    .workspace-card.active {
      border-color: var(--primary-2);
      box-shadow: inset 3px 0 0 var(--primary-2);
    }
    .workspace-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 99px;
      flex: 0 0 auto;
    }
    .workspace-meta {
      color: #aab2bd;
      font-size: 11px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .target-switch {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      margin: 7px 0 9px;
    }
    .target-btn {
      height: 30px;
      border-radius: 7px;
      border: 1px solid rgba(255,255,255,0.1);
      background: var(--dark-2);
      color: #c7cdd5;
      cursor: pointer;
    }
    .target-btn.active.primary { background: var(--primary); color: white; border-color: var(--primary); }
    .target-btn.active.compare { background: var(--compare); color: white; border-color: var(--compare); }
    .target-btn:disabled { opacity: 0.45; cursor: default; }

    .account-list {
      display: grid;
      gap: 5px;
    }
    .account-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 28px;
      gap: 5px;
      align-items: center;
    }
    .account-btn {
      min-width: 0;
      min-height: 34px;
      border: 1px solid transparent;
      border-radius: 7px;
      background: transparent;
      color: #d9dde3;
      cursor: pointer;
      padding: 7px 8px;
      text-align: left;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px;
      align-items: center;
    }
    .account-btn:hover { background: var(--dark-2); }
    .account-btn.active-left { background: rgba(15,118,110,0.28); border-color: rgba(20,184,166,0.6); }
    .account-btn.active-right { background: rgba(180,83,9,0.32); border-color: rgba(245,158,11,0.6); }
    .account-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-weight: 600;
    }
    .pane-chip {
      font-size: 10px;
      color: white;
      border-radius: 4px;
      padding: 2px 5px;
      background: var(--primary);
    }
    .pane-chip.right { background: var(--compare); }

    .icon-btn {
      height: 28px;
      min-width: 28px;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 7px;
      background: var(--dark-2);
      color: #c7cdd5;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .icon-btn:hover { background: var(--dark-3); color: white; }

    .ghost-btn, .solid-btn, .danger-btn {
      min-height: 32px;
      border-radius: 7px;
      padding: 0 10px;
      cursor: pointer;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--ink);
      white-space: nowrap;
    }
    .ghost-btn:hover { background: #f7f7f5; }
    .solid-btn {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }
    .solid-btn:hover { background: #0d645d; }
    .danger-btn {
      background: #fff;
      color: var(--danger);
      border-color: #fecaca;
    }
    .danger-btn:hover { background: #fef2f2; }

    .add-line {
      width: 100%;
      border: 1px dashed rgba(255,255,255,0.2);
      border-radius: 7px;
      min-height: 34px;
      background: transparent;
      color: #aab2bd;
      cursor: pointer;
    }
    .add-line:hover { color: white; background: var(--dark-2); }

    .main {
      min-width: 0;
      min-height: 0;
      display: grid;
      grid-template-rows: minmax(0, 1fr);
      padding-top: var(--titlebar);
      background: #fff;
      overflow: hidden;
      -webkit-app-region: no-drag;
    }

    .panes {
      min-height: 0;
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      background: #ebe7de;
      overflow: hidden;
    }
    .panes.compare {
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    }

    .pane {
      min-width: 0;
      min-height: 0;
      height: 100%;
      display: flex;
      flex-direction: column;
      border-right: 1px solid var(--line);
      background: #fff;
      overflow: hidden;
    }
    .pane:last-child { border-right: none; }
    .pane.focused {
      box-shadow: inset 0 0 0 2px var(--primary-2);
      z-index: 1;
    }
    .pane.right.focused { box-shadow: inset 0 0 0 2px #f59e0b; }

    .pane-head {
      min-height: 30px;
      padding: 2px 6px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      gap: 6px;
      background: #fff;
      position: relative;
      z-index: 20;
      -webkit-app-region: drag;
    }
    .pane-head-main {
      min-width: 0;
      flex: 1 1 160px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .pane-accent {
      width: 4px;
      height: 18px;
      border-radius: 99px;
      background: var(--pane-color, var(--primary));
      flex: 0 0 auto;
    }
    .pane-title {
      min-width: 0;
      display: flex;
      align-items: baseline;
      gap: 5px;
    }
    .pane-account {
      font-weight: 750;
      font-size: 12px;
      line-height: 1.2;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .pane-meta {
      color: var(--muted);
      font-size: 10px;
      font-weight: 650;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .pane-actions {
      display: flex;
      align-items: center;
      gap: 5px;
      flex-wrap: nowrap;
      justify-content: flex-end;
      overflow-x: auto;
      scrollbar-width: none;
      -webkit-app-region: no-drag;
    }
    .pane-actions::-webkit-scrollbar {
      display: none;
    }
    .pane-command {
      min-height: 24px;
      border-radius: 6px;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--ink);
      padding: 0 7px;
      cursor: pointer;
      white-space: nowrap;
    }
    .pane-command:hover { background: #f7f7f5; border-color: #b9c2bf; }
    .pane-command.primary {
      border-color: rgba(20,184,166,0.45);
      color: var(--primary);
      font-weight: 700;
    }
    .pane-command.danger {
      border-color: #fecaca;
      color: var(--danger);
    }
    .pane-command.danger:hover { background: #fef2f2; }
    .pages-menu {
      position: relative;
    }
    .pages-popover {
      position: absolute;
      right: 0;
      top: calc(100% + 4px);
      width: min(440px, calc(100vw - var(--rail) - 44px));
      max-height: min(520px, calc(100vh - 160px));
      overflow-y: auto;
      display: none;
      gap: 12px;
      padding: 12px;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
      z-index: 100;
    }
    .pages-menu.open .pages-popover,
    .pages-menu:focus-within .pages-popover {
      display: grid;
    }
    .page-menu-group {
      display: grid;
      gap: 7px;
    }
    .page-menu-title {
      color: var(--muted);
      font-size: 11px;
      font-weight: 750;
    }
    .page-menu-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .page-menu-btn {
      min-height: 30px;
      border-radius: 7px;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--ink);
      cursor: pointer;
      padding: 0 10px;
      white-space: nowrap;
    }
    .page-menu-btn:hover {
      border-color: var(--primary-2);
      color: var(--primary);
      background: #f0fdfa;
    }
    .page-menu-btn.active {
      border-color: var(--primary-2);
      color: var(--primary);
      background: #ecfdf5;
      font-weight: 700;
    }

    .tabs {
      min-height: 32px;
      border-bottom: 1px solid var(--line);
      background: #f7f5f0;
      display: flex;
      gap: 6px;
      padding: 4px 6px;
      overflow-x: auto;
    }
    .tabs.single {
      display: none;
    }
    .tab {
      height: 26px;
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 7px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 0 8px;
      cursor: pointer;
      max-width: 220px;
      white-space: nowrap;
    }
    .tab.active {
      color: var(--primary);
      border-color: var(--primary-2);
      box-shadow: inset 0 -2px 0 var(--primary-2);
    }
    .tab span {
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .tab-close {
      border: none;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      padding: 0;
      font-size: 14px;
      line-height: 1;
    }

    .surface {
      min-height: 0;
      flex: 1 1 auto;
      display: flex;
      background: #fff;
      position: relative;
      z-index: 1;
      overflow: hidden;
    }
    webview {
      flex: 1;
      min-height: 0;
      width: 100%;
      height: 100%;
      display: inline-flex;
      border: none;
      background: #fff;
    }
    .empty {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 36px;
      text-align: center;
      color: var(--muted);
      background: #f7f5f0;
    }
    .empty h3 {
      margin: 0 0 8px;
      color: var(--ink);
      font-size: 18px;
    }
    .empty p { margin: 0; max-width: 360px; }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 18px;
      transform: translateX(-50%) translateY(18px);
      opacity: 0;
      pointer-events: none;
      background: #111827;
      color: #fff;
      padding: 10px 16px;
      border-radius: 8px;
      box-shadow: var(--shadow);
      transition: opacity 0.18s, transform 0.18s;
      z-index: 2000;
    }
    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(15, 18, 24, 0.58);
      -webkit-app-region: no-drag;
    }
    .modal {
      width: min(440px, calc(100vw - 32px));
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 10px;
      box-shadow: var(--shadow);
      padding: 20px;
    }
    .modal h3 { margin: 0 0 14px; font-size: 17px; }
    .modal label {
      display: block;
      margin: 12px 0 5px;
      font-size: 11px;
      color: var(--muted);
      font-weight: 700;
    }
    .modal input, .modal select {
      width: 100%;
      height: 36px;
      border: 1px solid var(--line);
      border-radius: 7px;
      padding: 0 10px;
      background: #fff;
      color: var(--ink);
    }
    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 18px;
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="rail">
      <div class="brand">
        <div class="brand-row">
          <h1>Slack QA Launcher</h1>
          <button class="icon-btn" title="Add workspace" onclick="showAddWorkspace()">+</button>
        </div>
      </div>
      <div class="rail-body">
        <div class="section-head">Workspaces</div>
        <div class="workspace-grid" id="workspace-list"></div>

        <div class="section-head">
          <span>Open account in</span>
          <button class="icon-btn" title="Edit selected workspace" onclick="editSelectedWorkspace()">Edit</button>
        </div>
        <div class="target-switch">
          <button class="target-btn primary active" id="target-left" onclick="setFocusedPane('left')">Primary</button>
          <button class="target-btn compare" id="target-right" onclick="enableCompare('right')">Compare</button>
        </div>

        <div class="section-head">
          <span>Accounts</span>
          <button class="icon-btn" title="Add account" onclick="showAddAccount(selectedWorkspaceId)">+</button>
        </div>
        <div class="account-list" id="account-list"></div>
      </div>
    </aside>

    <main class="main">
      <section class="panes" id="panes"></section>
    </main>
  </div>
  <div class="toast" id="toast"></div>

<script>
  const CHROME_UA = 'Mozilla/5.0 (Macintosh; Intel Mac OS X 15_0_0) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/150.0.7871.47 Safari/537.36';
  const WS_COLORS = ['#0f766e','#7c3aed','#f97316','#db2777','#ca8a04','#2563eb','#dc2626','#475569'];
  const DEFAULT_WORKSPACES = [
    {
      id: 'testgrid',
      name: 'Testing Grid',
      color: '#0f766e',
      type: 'grid',
      orgId: 'E06P7UNEKML',
      domain: 'thetestingworkspace1',
      accounts: [
        { id: 'tg-po', role: 'Primary Owner' },
        { id: 'tg-owner', role: 'Owner' },
        { id: 'tg-admin', role: 'Admin' },
        { id: 'tg-member', role: 'Member' },
        { id: 'tg-mcg', role: 'Multi-Channel Guest' },
        { id: 'tg-scg', role: 'Single-Channel Guest' }
      ]
    },
    {
      id: 'plus',
      name: 'Plus Workspace',
      color: '#7c3aed',
      type: 'standalone',
      teamId: 'TVAD4EJ6A',
      domain: 'plus-workspace-group',
      accounts: [
        { id: 'plus-po', role: 'Primary Owner' },
        { id: 'plus-owner', role: 'Owner' },
        { id: 'plus-admin', role: 'Admin' },
        { id: 'plus-member', role: 'Member' },
        { id: 'plus-mcg', role: 'Multi-Channel Guest' },
        { id: 'plus-scg', role: 'Single-Channel Guest' }
      ]
    }
  ];

  function loadWorkspaces() {
    try {
      const stored = JSON.parse(localStorage.getItem('sl_workspaces') || 'null');
      if (Array.isArray(stored) && stored.length) return stored;
    } catch(e) {}
    return DEFAULT_WORKSPACES;
  }

  let WORKSPACES = loadWorkspaces();
  let selectedWorkspaceId = localStorage.getItem('sl_selected_workspace') || (WORKSPACES[0] && WORKSPACES[0].id);
  let focusedPane = 'left';
  let compareMode = false;
  let tabCounter = 0;
  let panes = { left: null, right: null };
  let paneWebviews = { left: null, right: null };
  let openPagesMenuSide = null;
  const emailCache = {};

  function saveWorkspaces() {
    localStorage.setItem('sl_workspaces', JSON.stringify(WORKSPACES));
  }

  function getWs(wsId) { return WORKSPACES.find(w => w.id === wsId); }
  function getAcc(ws, accId) { return ws && ws.accounts.find(a => a.id === accId); }
  function getAccById(accId) {
    for (const ws of WORKSPACES) {
      const acc = ws.accounts.find(a => a.id === accId);
      if (acc) return acc;
    }
    return null;
  }
  function getActivePane() { return panes[focusedPane] || panes.left || panes.right; }
  function activeTab(pane) {
    if (!pane || !pane.tabs || !pane.tabs.length) return null;
    return pane.tabs.find(t => t.id === pane.activeTabId) || pane.tabs[0];
  }
  function getEmail(acc) { return (acc && acc.email) || emailCache[acc && acc.id] || ''; }
  function paneLabel(side) { return side === 'left' ? 'Primary' : 'Compare'; }
  function workspaceHome(ws) {
    if (ws.teamId) return `https://app.slack.com/client/${ws.teamId}`;
    if (ws.orgId) return `https://app.slack.com/client/${ws.orgId}`;
    return `https://${ws.domain}.slack.com`;
  }
  function makeTab(title, url, pageIndex, kind) {
    return { id: `tab-${Date.now()}-${tabCounter++}`, title, url, pageIndex, kind: kind || 'page' };
  }
  function pageTitleFromUrl(url) {
    try {
      const parsed = new URL(url);
      if (parsed.hostname === 'mc.tinyspeck.com') {
        return parsed.pathname.includes('audit') ? 'MC Audit Logs' : 'MC Account';
      }
      return parsed.pathname.split('/').filter(Boolean).pop() || parsed.hostname;
    } catch(e) {
      return 'Browser';
    }
  }

  function generatePages(ws) {
    const workspacePages = [
      { group: 'Workspace', name: 'Home', url: workspaceHome(ws), kind: 'slack' },
      { group: 'Workspace', name: 'Members', url: `https://${ws.domain}.slack.com/admin`, kind: 'slack' },
      { group: 'Workspace', name: 'Channels', url: `https://${ws.domain}.slack.com/admin/manage-channels`, kind: 'slack' },
      { group: 'Workspace', name: 'Settings', url: `https://${ws.domain}.slack.com/admin/settings`, kind: 'slack' },
      { group: 'Workspace', name: 'Permissions', url: `https://${ws.domain}.slack.com/admin/settings#permissions`, kind: 'slack' },
      { group: 'Workspace', name: 'Slack Connect', url: `https://${ws.domain}.slack.com/admin/settings#shared_channels_permissions`, kind: 'slack' },
      { group: 'Workspace', name: 'Analytics', url: `https://${ws.domain}.slack.com/admin/stats`, kind: 'slack' },
      { group: 'Workspace', name: 'Access Logs', url: `https://${ws.domain}.slack.com/account/logs`, kind: 'slack' },
      { group: 'Workspace', name: 'Exports', url: `https://${ws.domain}.slack.com/services/export`, kind: 'slack' }
    ];

    if (ws.type !== 'grid') return workspacePages;

    return [
      ...workspacePages,
      { group: 'Enterprise Grid', name: 'Org Dashboard', url: `https://app.slack.com/manage/${ws.orgId}`, kind: 'slack' },
      { group: 'Enterprise Grid', name: 'Org Members', url: `https://app.slack.com/manage/${ws.orgId}/people`, kind: 'slack' },
      { group: 'Enterprise Grid', name: 'Org Channels', url: `https://app.slack.com/manage/${ws.orgId}/channels`, kind: 'slack' },
      { group: 'Enterprise Grid', name: 'Org Permissions', url: `https://app.slack.com/manage/${ws.orgId}/people/permissions/account-types`, kind: 'slack' },
      { group: 'Enterprise Grid', name: 'Org Audit Logs', url: `https://app.slack.com/manage/${ws.orgId}/security/audit-logs`, kind: 'slack' },
      { group: 'Enterprise Grid', name: 'Org Exports', url: `https://app.slack.com/manage/${ws.orgId}/security/exports`, kind: 'slack' },
      { group: 'Enterprise Grid', name: 'Slack Connect Settings', url: `https://app.slack.com/manage/${ws.orgId}/slack-connect/settings/channels`, kind: 'slack' }
    ];
  }

  function render() {
    renderSidebar();
    renderPanes();
  }

  function renderSidebar() {
    const workspaceList = document.getElementById('workspace-list');
    workspaceList.innerHTML = '';

    WORKSPACES.forEach(ws => {
      const btn = document.createElement('button');
      btn.className = 'workspace-card' + (ws.id === selectedWorkspaceId ? ' active' : '');
      btn.onclick = () => selectWorkspace(ws.id);
      btn.innerHTML = `
        <div class="workspace-title">
          <span class="dot" style="background:${ws.color || '#0f766e'}"></span>
          <span>${ws.name}</span>
        </div>
        <div class="workspace-meta">${ws.type === 'grid' ? 'Enterprise Grid' : 'Business Plus'} - ${ws.domain}.slack.com</div>
      `;
      workspaceList.appendChild(btn);
    });

    document.getElementById('target-left').classList.toggle('active', focusedPane === 'left');
    document.getElementById('target-right').classList.toggle('active', focusedPane === 'right');
    document.getElementById('target-right').disabled = false;

    const accountList = document.getElementById('account-list');
    accountList.innerHTML = '';
    const ws = getWs(selectedWorkspaceId);
    if (!ws) return;

    ws.accounts.forEach(acc => {
      const row = document.createElement('div');
      row.className = 'account-row';
      const isLeft = panes.left && panes.left.accountId === acc.id;
      const isRight = panes.right && panes.right.accountId === acc.id;

      const btn = document.createElement('button');
      btn.className = 'account-btn' + (isLeft ? ' active-left' : '') + (isRight ? ' active-right' : '');
      btn.innerHTML = `
        <span class="account-name">${acc.role}</span>
        <span>${isLeft ? '<span class="pane-chip">P</span>' : ''}${isRight ? '<span class="pane-chip right">C</span>' : ''}</span>
      `;
      btn.onclick = e => {
        const side = compareMode ? (e.shiftKey ? 'right' : focusedPane) : 'left';
        selectAccount(ws.id, acc.id, side);
      };
      btn.oncontextmenu = e => {
        e.preventDefault();
        enableCompare('right');
        selectAccount(ws.id, acc.id, 'right');
      };
      row.appendChild(btn);

      const emailBtn = document.createElement('button');
      emailBtn.className = 'icon-btn';
      emailBtn.title = getEmail(acc) || 'Copy or save email';
      emailBtn.textContent = '@';
      emailBtn.onclick = e => {
        e.stopPropagation();
        copyOrSaveEmail(ws.id, acc.id);
      };
      row.appendChild(emailBtn);

      accountList.appendChild(row);
    });

    const add = document.createElement('button');
    add.className = 'add-line';
    add.textContent = '+ Add account';
    add.onclick = () => showAddAccount(ws.id);
    accountList.appendChild(add);

  function renderPanes() {
    const panesEl = document.getElementById('panes');
    panesEl.className = 'panes' + (compareMode ? ' compare' : '');
    panesEl.innerHTML = '';
    paneWebviews = { left: null, right: null };

    panesEl.appendChild(buildPane('left'));
    if (compareMode) panesEl.appendChild(buildPane('right'));

    syncPaneWebview('left');
    if (compareMode) syncPaneWebview('right');
  }

  function escapeHtml(value) {
    return String(value == null ? '' : value).replace(/[&<>"']/g, ch => ({
      '&': '&amp;',
      '<': '&lt;',
      '>': '&gt;',
      '"': '&quot;',
      "'": '&#39;'
    })[ch]);
  }

  function buildPagesMenu(side, state, currentTab) {
    const ws = getWs(state.workspaceId);
    const pages = generatePages(ws);
    const groups = [...new Set(pages.map(page => page.group))];
    const isOpen = openPagesMenuSide === side;
    const groupsHtml = groups.map(group => {
      const buttons = pages.map((page, index) => {
        if (page.group !== group) return '';
        const active = currentTab && currentTab.url === page.url;
        return `<button class="page-menu-btn${active ? ' active' : ''}" type="button" data-page-index="${index}" title="${escapeHtml(page.url)}">${escapeHtml(page.name)}</button>`;
      }).join('');

      return `
        <div class="page-menu-group">
          <div class="page-menu-title">${escapeHtml(group)}</div>
          <div class="page-menu-grid">${buttons}</div>
        </div>
      `;
    }).join('');

    return `
      <div class="pages-menu${isOpen ? ' open' : ''}">
        <button class="pane-command primary" type="button" data-pane-action="pages" aria-haspopup="true" aria-expanded="${isOpen ? 'true' : 'false'}">Pages</button>
        <div class="pages-popover" role="menu" aria-label="${escapeHtml(ws.name)} page shortcuts">${groupsHtml}</div>
      </div>
    `;
  }

  function closePagesMenus() {
    openPagesMenuSide = null;
    document.querySelectorAll('.pages-menu.open').forEach(menu => {
      menu.classList.remove('open');
      const btn = menu.querySelector('[data-pane-action="pages"]');
      if (btn) btn.setAttribute('aria-expanded', 'false');
    });
  }

  function togglePagesMenu(side, pane) {
    const menu = pane.querySelector('.pages-menu');
    const btn = menu && menu.querySelector('[data-pane-action="pages"]');
    const willOpen = openPagesMenuSide !== side;
    closePagesMenus();
    if (!willOpen || !menu) return;
    openPagesMenuSide = side;
    menu.classList.add('open');
    if (btn) btn.setAttribute('aria-expanded', 'true');
  }

  function bindPaneActions(pane, side) {
    pane.querySelectorAll('[data-pane-action]').forEach(btn => {
      btn.addEventListener('click', event => {
        event.stopPropagation();
        const action = btn.getAttribute('data-pane-action');
        if (action === 'pages') {
          togglePagesMenu(side, pane);
          return;
        }
        closePagesMenus();
        if (action === 'email') copyPaneEmail(side);
        if (action === 'account') openAccount(side);
        if (action === 'audit') openAuditLogs(side);
        if (action === 'reset') resetAccount(side);
        if (action === 'close') closeCompare();
      });
    });

    const popover = pane.querySelector('.pages-popover');
    if (popover) popover.addEventListener('click', event => event.stopPropagation());

    pane.querySelectorAll('[data-page-index]').forEach(btn => {
      btn.addEventListener('click', event => {
        event.stopPropagation();
        const state = panes[side];
        if (!state) return showToast('Open an account first');
        const ws = getWs(state.workspaceId);
        const pages = generatePages(ws);
        const index = Number(btn.getAttribute('data-page-index'));
        const page = pages[index];
        if (page) {
          closePagesMenus();
          openPageInPane(side, page, index);
        }
      });
    });
  }

  function buildPane(side) {
    const state = panes[side];
    const pane = document.createElement('section');
    pane.className = 'pane' + (focusedPane === side ? ' focused' : '') + (side === 'right' ? ' right' : '');
    pane.onclick = e => {
      if (e.target.tagName === 'WEBVIEW') return;
      setFocusedPane(side);
    };

    if (!state) {
      pane.innerHTML = `
        <div class="pane-head">
          <div class="pane-head-main">
            <span class="pane-accent"></span>
            <div class="pane-title">
              <div class="pane-account">Open a role</div>
              <div class="pane-meta">${paneLabel(side)}</div>
            </div>
          </div>
          ${side === 'right' ? '<button class="pane-command" type="button" data-pane-action="close">Close</button>' : ''}
        </div>
        <div class="tabs single"></div>
        <div class="surface">
          <div class="empty"><div><h3>${side === 'left' ? 'Open a role' : 'Compare another role'}</h3><p>${side === 'left' ? 'Pick any account from the sidebar. Its Slack session opens here.' : 'Select a workspace and account while Compare is focused, or right-click any account.'}</p></div></div>
        </div>
      `;
      bindPaneActions(pane, side);
      return pane;
    }

    const ws = getWs(state.workspaceId);
    const acc = getAcc(ws, state.accountId);
    const tab = activeTab(state);
    pane.innerHTML = `
      <div class="pane-head">
        <div class="pane-head-main" style="--pane-color:${escapeHtml(ws.color || '#0f766e')}">
          <span class="pane-accent"></span>
          <div class="pane-title">

          </div>
        </div>
        <div class="pane-actions">

          <button class="pane-command" type="button" data-pane-action="email" title="Copy or save this role's email">Email</button>

          <button class="pane-command" type="button" data-pane-action="audit" title="Open MC audit logs for this workspace or org">MC Audit</button>
          <button class="pane-command danger" type="button" data-pane-action="reset" title="Leave channels, close DMs, and delete drafts for this Slack account">Reset</button>
          ${side === 'right' ? '<button class="pane-command" type="button" data-pane-action="close">Close</button>' : ''}
        </div>
      </div>
      <div class="tabs" id="tabs-${side}"></div>
      <div class="surface" id="surface-${side}"></div>
    `;

    const tabs = pane.querySelector(`#tabs-${side}`);
    if (state.tabs.length <= 1) tabs.classList.add('single');
    state.tabs.forEach(t => {
      const tabBtn = document.createElement('button');
      tabBtn.className = 'tab' + (t.id === state.activeTabId ? ' active' : '');
      tabBtn.title = t.url;
      tabBtn.innerHTML = `<span>${t.title}</span>${state.tabs.length > 1 ? '<button class="tab-close" title="Close tab">x</button>' : ''}`;
      tabBtn.onclick = () => switchTab(side, t.id);
      const close = tabBtn.querySelector('.tab-close');
      if (close) {
        close.onclick = e => {
          e.stopPropagation();
          closeTab(side, t.id);
        };
      }
      tabs.appendChild(tabBtn);
    });

    bindPaneActions(pane, side);

    if (tab && tab.kind === 'mc') {
      const note = document.createElement('div');
      note.className = 'empty';
      note.style.display = 'none';
    }

    return pane;
  }

  function syncPaneWebview(side) {
    const state = panes[side];
    const surface = document.getElementById(`surface-${side}`);
    if (!state || !surface) return;
    const tab = activeTab(state);
    if (!tab) return;

    const partition = tab.kind === 'mc' ? 'persist:internal-tools' : `persist:${state.accountId}`;
    const webview = document.createElement('webview');
    webview.setAttribute('partition', partition);
    webview.setAttribute('useragent', CHROME_UA);
    if (window.electronAPI && window.electronAPI.webviewPreloadPath) {
      webview.setAttribute('preload', window.electronAPI.webviewPreloadPath);
    }
    webview.setAttribute('allowpopups', '');
    webview.setAttribute('src', tab.url);
    webview.style.flex = '1 1 auto';
    webview.style.width = '100%';
    webview.style.height = '100%';
    webview.style.minHeight = '0';
    webview.style.display = 'inline-flex';

    const normalizeSlackViewport = () => {
      if (tab.kind === 'mc') return;
      try {
        if (typeof webview.setZoomFactor === 'function') webview.setZoomFactor(0.9);
      } catch(e) {}
      webview.executeJavaScript(`
        window.scrollTo(0, 0);
        if (document.scrollingElement) document.scrollingElement.scrollTop = 0;
        void 0;
      `).catch(() => {});
    };

    webview.addEventListener('did-navigate', e => {
      setStatus(e.url, 'good');
      normalizeSlackViewport();
    });
    webview.addEventListener('did-navigate-in-page', e => {
      setStatus(e.url, 'good');
    });
    webview.addEventListener('did-fail-load', e => {
      if (e.errorCode !== -3) setStatus(`Load failed: ${e.errorDescription}`, 'bad');
    });
    webview.addEventListener('dom-ready', () => {
      normalizeSlackViewport();
      if (tab.kind !== 'mc') fetchEmailForAccount(state.accountId);
    });
    webview.addEventListener('did-finish-load', normalizeSlackViewport);
    surface.innerHTML = '';
    surface.appendChild(webview);
    paneWebviews[side] = webview;
  }

  function selectAccount(wsId, accId, side) {
    if (side === 'right') compareMode = true;
    focusedPane = side;
    selectedWorkspaceId = wsId;
    localStorage.setItem('sl_selected_workspace', wsId);

  function openPageInPane(side, page, pageIndex) {
    const state = panes[side];
    if (!state) {
      showToast('Open an account first');
      return;
    }
    let tab = state.tabs.find(t => t.url === page.url);
    if (!tab) {
      tab = makeTab(page.name, page.url, pageIndex, page.kind || 'slack');
      state.tabs.push(tab);
    }
    state.activeTabId = tab.id;
    focusedPane = side;
    render();
  }

  function openPageInFocusedPane(page, pageIndex) {
    openPageInPane(focusedPane, page, pageIndex);
  }

  function openBrowserTab(side, title, url, kind) {
    const state = panes[side];
    if (!state) {
      showToast('Open an account first');
      return;
    }
    const tab = makeTab(title || pageTitleFromUrl(url), url, -1, kind || 'browser');
    state.tabs.push(tab);
    state.activeTabId = tab.id;
    focusedPane = side;
    render();
  }

  function switchTab(side, tabId) {
    const state = panes[side];
    if (!state) return;
    state.activeTabId = tabId;
    focusedPane = side;
    render();
  }

  function closeTab(side, tabId) {
    const state = panes[side];
    if (!state || state.tabs.length <= 1) return;
    const idx = state.tabs.findIndex(t => t.id === tabId);
    if (idx < 0) return;
    state.tabs.splice(idx, 1);
    if (state.activeTabId === tabId) {
      state.activeTabId = state.tabs[Math.max(0, idx - 1)].id;
    }
    render();
  }

    document.body.appendChild(overlay);
  }

  async function copyOrSaveEmail(wsId, accId) {
    const ws = getWs(wsId);
    const acc = getAcc(ws, accId);
    if (!acc) return;
    let email = getEmail(acc) || await fetchEmailForAccount(acc.id, true);
    if (!email) {
      const entered = prompt(`Email for ${ws.name} - ${acc.role}`);
      if (!entered) {
        showToast('No email saved');
        return;
      }
      email = entered.trim();
      if (!email) {
        showToast('No email saved');
        return;
      }
      acc.email = email;
      emailCache[acc.id] = email;
      saveWorkspaces();
      renderSidebar();
    }
    try {
      if (window.electronAPI && window.electronAPI.writeClipboard) {
        await window.electronAPI.writeClipboard(email);
      } else {
        await navigator.clipboard.writeText(email);
      }
      showToast('Copied ' + email);
    } catch(e) {
      showToast('Copy failed: ' + e.message);
    }
  }

  async function fetchEmailForAccount(accId, immediate) {
    const acc = getAccById(accId);
    if (getEmail(acc)) return getEmail(acc);
    const webview = paneWebviews.left && panes.left && panes.left.accountId === accId
      ? paneWebviews.left
      : paneWebviews.right && panes.right && panes.right.accountId === accId
        ? paneWebviews.right
        : null;
    if (!webview) return '';

    const read = () => webview.executeJavaScript(`
      (async function() {
        var token = '';
        if (window.boot_data && window.boot_data.api_token) token = window.boot_data.api_token;
        if (!token && window.TS && window.TS.boot_data && window.TS.boot_data.api_token) token = window.TS.boot_data.api_token;
        if (!token) {
          var html = document.documentElement.innerHTML.substring(0, 100000);
          var m = html.match(/"token":"(xox[csp]-[^"]+)"/);
          if (m) token = m[1];
        }
        if (!token) return '';
        var resp = await fetch('/api/users.profile.get', {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: 'token=' + encodeURIComponent(token)
        });
        var data = await resp.json();
        return (data && data.ok && data.profile && data.profile.email) || '';
      })();
    `).then(email => {
      if (email) {
        emailCache[accId] = email;
        const found = getAccById(accId);
        if (found && !found.email) {
          found.email = email;
          saveWorkspaces();
        }
        renderSidebar();
      }
      return email || '';
    }).catch(() => '');

    if (immediate) return read();
    setTimeout(read, 3500);
    return '';
  }

  const SLACK_ALPHABET = '0123456789ABCDEFGHJKLMNPQRSTUVWXYZ';
  function decodeSlackId(encodedId) {
    const stripped = String(encodedId || '').replace(/^[A-Z][a-z]?/, '');
    let result = 0;
    for (let i = 0; i < stripped.length; i += 2) {
      const hi = SLACK_ALPHABET.indexOf(stripped[i]);
      const lo = SLACK_ALPHABET.indexOf(stripped[i + 1]);
      if (hi < 0 || lo < 0) return '';
      result = result * 1000 + (hi * 34 + lo);
    }
    return result;
  }

  function isSlackTab(tab) {
    return tab && (tab.kind === 'slack' || tab.kind === 'page');
  }

  function ensureSlackTab(side, actionName) {
    const state = panes[side];
    if (!state) {
      showToast('Open an account first');
      return false;
    }

    const tab = activeTab(state);
    if (isSlackTab(tab)) return true;

    let slackTab = state.tabs.find(isSlackTab);
    if (!slackTab) {
      const ws = getWs(state.workspaceId);
      slackTab = makeTab('Home', workspaceHome(ws), 0, 'slack');
      state.tabs.unshift(slackTab);
    }

    state.activeTabId = slackTab.id;
    focusedPane = side;
    render();
    setStatus(`${actionName} needs the Slack tab for this account`, 'bad');
    showToast(`Switched ${paneLabel(side)} back to Slack. Try ${actionName} again after it loads.`);
    return false;
  }

  window.openAuditLogs = function(side) {
    const state = panes[side];
    if (!state) return showToast('Open an account first');
    const ws = getWs(state.workspaceId);
    const encoded = ws.orgId || ws.teamId;
    const rawId = decodeSlackId(encoded);
    if (!rawId) return showToast('No org/team ID configured');
    openBrowserTab(side, 'MC Audit Logs', `https://mc.tinyspeck.com/mc/external_audit_logs.php?id=${rawId}`, 'mc');
    setStatus(`Opening MC audit logs for ${ws.name}`, 'good');
    showToast('Opened MC Audit tab');
  };

  window.openAccount = async function(side) {
    const state = panes[side];
    if (!state) return showToast('Open an account first');
    if (!ensureSlackTab(side, 'MC Account')) return;
    const webview = paneWebviews[side];
    if (!webview) {
      setStatus('Slack tab is still loading', 'bad');
      return showToast('Slack is still loading in this pane');
    }
    setStatus('Extracting account info...', 'good');
    try {
      const ids = await Promise.race([
        webview.executeJavaScript(`
          (function() {
            var uid = '', tid = '';
            if (window.boot_data) { uid = window.boot_data.user_id || ''; tid = window.boot_data.team_id || ''; }
            if ((!uid || !tid) && window.TS && window.TS.boot_data) { uid = uid || window.TS.boot_data.user_id || ''; tid = tid || window.TS.boot_data.team_id || ''; }
            if (!uid || !tid) {
              try {
                for (var i = 0; i < localStorage.length; i++) {
                  var key = localStorage.key(i);
                  var val = localStorage.getItem(key);
                  if (val && val.length < 500000) {
                    if (!uid) { var m = val.match(/"user_id":"(U[A-Z0-9]+)"/); if (m) uid = m[1]; }
                    if (!tid) { var m2 = val.match(/"team_id":"(T[A-Z0-9]+)"/); if (m2) tid = m2[1]; }
                    if (uid && tid) break;
                  }
                }
              } catch(e) {}
            }
            if (!tid) {
              var urlMatch = location.pathname.match(/\\/client\\/([TE][A-Z0-9]+)/);
              if (urlMatch) tid = urlMatch[1];
            }
            return { userId: uid, teamId: tid };
          })();
        `),
        new Promise((_, reject) => setTimeout(() => reject(new Error('timeout')), 5000))
      ]);
      if (!ids || !ids.userId || !ids.teamId) {
        setStatus('Could not find user/team ID yet', 'bad');
        showToast('Let Slack finish loading, then try again');
        return;
      }
      openBrowserTab(side, 'MC Account', `https://mc.tinyspeck.com/mc/user_prefs.php?id=${ids.userId}&team_id=${ids.teamId}`, 'mc');
      showToast('Opened MC Account tab');
    } catch(e) {
      setStatus('MC account error: ' + e.message, 'bad');
      showToast('MC Account failed: ' + e.message);
    }
  };

  window.resetAccount = async function(side) {
    const state = panes[side];
    if (!state) return showToast('Open an account first');
    if (!ensureSlackTab(side, 'Reset')) return;
    const webview = paneWebviews[side];
    if (!webview) {
      setStatus('Slack tab is still loading', 'bad');
      return showToast('Slack is still loading in this pane');
    }
    setStatus('Extracting token...', 'good');
    try {
      const result = await webview.executeJavaScript(`
        (async () => {
          let token = null;
          if (window.boot_data && window.boot_data.api_token) token = window.boot_data.api_token;
          if (!token && window.TS && window.TS.boot_data && window.TS.boot_data.api_token) token = window.TS.boot_data.api_token;
          if (!token) {
            try {
              const lc = localStorage.getItem('localConfig_v2');
              if (lc) {
                const m = lc.match(/"token":"(xoxc-[^"]+)"/);
                if (m) token = m[1];
              }
            } catch(e) {}
          }
          if (!token) {
            try {
              for (let i = 0; i < localStorage.length; i++) {
                const val = localStorage.getItem(localStorage.key(i));
                if (val && val.includes('xoxc-')) {
                  const m = val.match(/xoxc-[a-zA-Z0-9._-]+/);
                  if (m) { token = m[0]; break; }
                }
              }
            } catch(e) {}
          }
          if (!token) return { error: 'Could not find token. Make sure Slack is fully loaded.' };
          const countsForm = new FormData();
          countsForm.append('token', token);
          const countsRes = await fetch('/api/client.counts', { method: 'POST', body: countsForm, credentials: 'include' });
          const countsData = await countsRes.json();
          if (!countsData.ok) return { error: 'client.counts: ' + countsData.error };
          const channelIds = (countsData.channels || []).map(c => c.id);
          const imIds = (countsData.ims || []).map(c => c.id);
          const mpimIds = (countsData.mpims || []).map(c => c.id);
          let left = 0, closed = 0, draftsDeleted = 0, skipped = 0, errors = [];
          const draftsForm = new FormData();
          draftsForm.append('token', token);
          const draftsRes = await fetch('/api/drafts.list', { method: 'POST', body: draftsForm, credentials: 'include' });
          const draftsData = await draftsRes.json();
          if (draftsData.ok && draftsData.drafts) {
            const now = (Date.now() / 1000).toFixed(6);
            for (const draft of draftsData.drafts.filter(d => !d.is_deleted)) {
              const df = new FormData();
              df.append('token', token);
              df.append('draft_id', draft.id);
              df.append('client_last_updated_ts', now);
              const dr = await fetch('/api/drafts.delete', { method: 'POST', body: df, credentials: 'include' });
              const dd = await dr.json();
              if (dd.ok) draftsDeleted++;
            }
          }
          for (const chId of channelIds) {
            const form = new FormData();
            form.append('token', token);
            form.append('channel', chId);
            const res = await fetch('/api/conversations.leave', { method: 'POST', body: form, credentials: 'include' });
            const data = await res.json();
            if (data.ok) left++;
            else if (data.error === 'cant_leave_general' || data.error === 'last_member' || data.error === 'channel_not_found') skipped++;
            else errors.push('leave ' + chId + ': ' + data.error);
          }
          for (const dmId of [...imIds, ...mpimIds]) {
            const form = new FormData();
            form.append('token', token);
            form.append('channel', dmId);
            const res = await fetch('/api/conversations.close', { method: 'POST', body: form, credentials: 'include' });
            const data = await res.json();
            if (data.ok || data.already_closed) closed++;
            else errors.push('close ' + dmId + ': ' + data.error);
          }
          return { left, closed, draftsDeleted, skipped, errors };
        })();
      `);
      if (result.error) {
        setStatus('Reset failed: ' + result.error, 'bad');
        showToast(result.error);
      } else {
        setStatus(`Reset: left ${result.left}, closed ${result.closed}, deleted ${result.draftsDeleted} drafts`, 'good');
        showToast('Reset completed');
        webview.reload();
      }
    } catch(e) {
      setStatus('Reset error: ' + e.message, 'bad');
      showToast('Reset failed: ' + e.message);
    }
  };

  function setStatus(text, mode) {
    if (mode === 'bad') showToast(text);
  }

  function showToast(msg) {
    const toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 1800);
  }

  if (window.electronAPI && window.electronAPI.onOpenInSplit) {
    window.electronAPI.onOpenInSplit(url => {
      const side = panes[focusedPane] ? focusedPane : (panes.left ? 'left' : null);
      if (!side) {
        window.electronAPI.openExternal(url);
        return;
      }
      openBrowserTab(side, pageTitleFromUrl(url), url, 'browser');
    });
  }

  document.addEventListener('click', () => closePagesMenus());
  document.addEventListener('keydown', event => {
    if (event.key === 'Escape') closePagesMenus();
  });

  render();
</script>
</body>
</html>
