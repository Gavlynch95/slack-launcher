<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Slack Launcher</title>
  <style>
    :root { --nav: 284px; --ink: #eef2ff; --muted: #9ca8c7; --line: rgba(164,179,255,.15); --panel: rgba(18,25,51,.84); --panel-2: #151d38; --accent: #7c83ff; --cyan: #53d5ff; --danger: #ff6b86; --success: #62e6a7; }
    * { box-sizing: border-box; }
    body { margin: 0; height: 100vh; overflow: hidden; color: var(--ink); font: 13px/1.35 Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #080c18 radial-gradient(1000px 700px at 0 -10%, #202960 0%, transparent 58%) no-repeat; display: flex; }
    button, input, select { font: inherit; } button { cursor: pointer; }
    .sidebar { width: var(--nav); flex: 0 0 var(--nav); display: flex; flex-direction: column; background: linear-gradient(180deg,rgba(17,24,51,.96),rgba(9,13,28,.95)); border-right: 1px solid var(--line); -webkit-app-region: no-drag; overflow: hidden; }
    .brand { height: 82px; padding: 34px 18px 12px; display: flex; justify-content: space-between; align-items: center; -webkit-app-region: drag; }
    .brand-mark { display: flex; align-items: center; gap: 9px; font-weight: 750; letter-spacing: -.2px; font-size: 15px; }
    .spark { width: 23px; height: 23px; display: grid; place-items: center; color: #111733; background: linear-gradient(145deg,var(--cyan),#a99bff); border-radius: 7px; font-weight: 900; box-shadow: 0 0 20px rgba(83,213,255,.3); }
    .split-toggle { -webkit-app-region: no-drag; border: 1px solid var(--line); color: var(--muted); background: rgba(255,255,255,.04); border-radius: 8px; padding: 5px 8px; font-size: 11px; font-weight: 700; }
    .split-toggle.active { color: white; border-color: rgba(124,131,255,.7); background: rgba(124,131,255,.28); }
    .sidebar-scroll { overflow: auto; padding: 0 10px 16px; }
    .helper { color: var(--muted); margin: 0 8px 14px; font-size: 11px; }
    .compare-tools { display: flex; gap: 6px; margin: -7px 4px 14px; }
    .compare-tools button { flex: 1; padding: 7px 5px; border: 1px solid rgba(124,131,255,.32); border-radius: 7px; color: #dce0ff; background: rgba(124,131,255,.11); font-size: 10px; font-weight: 700; }
    .compare-tools button:hover { color: white; border-color: var(--cyan); background: rgba(83,213,255,.14); }
    .compare-tools button:disabled { cursor: not-allowed; opacity: .42; }
    .workspace { margin: 0 0 7px; border: 1px solid transparent; border-radius: 11px; }
    .workspace:hover { background: rgba(255,255,255,.025); border-color: rgba(255,255,255,.04); }
    .workspace-head { min-height: 35px; padding: 6px 7px 5px 9px; display: flex; align-items: center; gap: 8px; }
    .dot { width: 8px; height: 8px; flex: 0 0 8px; border-radius: 50%; box-shadow: 0 0 9px currentColor; }
    .workspace-name { min-width: 0; flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-weight: 680; }
    .type { color: var(--muted); font-size: 9px; text-transform: uppercase; letter-spacing: .09em; }
    .icon-button { display: inline-grid; place-items: center; width: 26px; height: 26px; border: 0; color: var(--muted); background: transparent; border-radius: 6px; }
    .icon-button:hover { color: white; background: rgba(255,255,255,.1); }
    .accounts { padding: 0 2px 5px; }
    .account-row { display: flex; align-items: center; gap: 1px; }
    .account { min-width: 0; flex: 1; padding: 7px 7px 7px 15px; border: 1px solid transparent; background: transparent; border-radius: 7px; color: var(--muted); text-align: left; display: flex; align-items: center; gap: 6px; }
    .account:hover { color: var(--ink); background: rgba(255,255,255,.06); }
    .account.selected { color: white; border-color: color-mix(in srgb, var(--workspace-color) 55%, transparent); background: color-mix(in srgb, var(--workspace-color) 18%, transparent); }
    .account-name { min-width: 0; flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .pane-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--workspace-color); box-shadow: 0 0 7px var(--workspace-color); }
    .lane-buttons { display: flex; gap: 2px; }
    .lane-button { width: 19px; height: 20px; padding: 0; border: 1px solid rgba(255,255,255,.12); border-radius: 5px; color: var(--muted); background: rgba(255,255,255,.03); font-size: 10px; font-weight: 800; }
    .lane-button:hover { color: white; border-color: rgba(255,255,255,.5); background: rgba(255,255,255,.13); }
    .lane-button.a.occupied { color: #071525; border-color: var(--cyan); background: var(--cyan); }
    .lane-button.b.occupied { color: #160d2c; border-color: #b291ff; background: #b291ff; }
    .add-row { width: 100%; margin-top: 3px; padding: 6px 10px 6px 15px; border: 0; color: var(--muted); text-align: left; background: transparent; font-size: 11px; }
    .add-row:hover { color: var(--cyan); }
    .add-workspace { margin: 10px 4px 0; width: calc(100% - 8px); padding: 9px; color: var(--ink); background: rgba(124,131,255,.12); border: 1px dashed rgba(151,158,255,.35); border-radius: 9px; font-size: 12px; }
    .add-workspace:hover { background: rgba(124,131,255,.22); }
    .app { flex: 1; min-width: 0; display: flex; }
    .panes { flex: 1; display: flex; min-width: 0; }
    .pane { min-width: 0; flex: 1; display: flex; flex-direction: column; background: rgba(5,8,18,.34); position: relative; }
    .pane + .pane { border-left: 1px solid rgba(185,199,255,.27); }
    .pane.focused::after { content: ""; pointer-events: none; position: absolute; inset: 0; border: 1px solid var(--pane-color); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--pane-color) 25%, transparent); z-index: 4; }
    .pane-top { flex: 0 0 auto; min-height: 64px; padding: 13px 14px 10px; display: flex; align-items: center; gap: 13px; background: linear-gradient(90deg,color-mix(in srgb,var(--pane-color) 22%,#10172c),#11182d 50%,#11182d); border-bottom: 1px solid var(--line); }
    .pane-identity { min-width: 130px; flex: 1; }
    .pane-label { color: var(--pane-color); text-transform: uppercase; letter-spacing: .1em; font-size: 9px; font-weight: 800; }
    .pane-title { max-width: 240px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14px; font-weight: 720; }
    .pane-subtitle { max-width: 240px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); font-size: 11px; }
    .actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 5px; }
    .action { border: 1px solid rgba(255,255,255,.15); color: #dbe2ff; background: rgba(255,255,255,.06); padding: 5px 7px; border-radius: 6px; font-size: 10px; white-space: nowrap; }
    .action:hover { border-color: rgba(255,255,255,.45); background: rgba(255,255,255,.13); color: white; }
    .action.mc { color: #cdefff; border-color: rgba(83,213,255,.29); }
    .action.reset:hover { color: white; border-color: var(--danger); background: rgba(255,107,134,.23); }
    .page-strip { min-height: 39px; overflow-x: auto; display: flex; align-items: center; gap: 5px; padding: 7px 12px; background: rgba(13,19,40,.97); border-bottom: 1px solid var(--line); scrollbar-width: thin; }
    .page { padding: 5px 8px; color: var(--muted); border: 1px solid transparent; background: transparent; border-radius: 6px; font-size: 11px; white-space: nowrap; }
    .page:hover { color: white; background: rgba(255,255,255,.07); }
    .page.active { color: white; background: color-mix(in srgb,var(--pane-color) 25%,transparent); border-color: color-mix(in srgb,var(--pane-color) 55%,transparent); }
    .page-separator { height: 15px; width: 1px; flex: 0 0 1px; background: var(--line); margin: 0 2px; }
    .content { min-height: 0; flex: 1; display: flex; background: #fff; }
    webview { flex: 1; width: 100%; height: 100%; border: 0; }
    .empty { flex: 1; display: grid; place-content: center; gap: 9px; text-align: center; padding: 40px; color: var(--muted); background: radial-gradient(500px 340px at 50% 10%,rgba(124,131,255,.15),transparent 70%); }
    .empty strong { color: var(--ink); font-size: 18px; }
    .empty kbd { color: var(--cyan); font: inherit; }
    .toast { position: fixed; z-index: 30; bottom: 20px; left: 50%; transform: translate(-50%,20px); padding: 9px 14px; max-width: 80vw; color: white; background: rgba(11,16,35,.95); border: 1px solid rgba(187,202,255,.26); box-shadow: 0 12px 35px rgba(0,0,0,.4); border-radius: 9px; opacity: 0; pointer-events: none; transition: .18s ease; }
    .toast.show { opacity: 1; transform: translate(-50%,0); }
    .modal-wrap { position: fixed; z-index: 40; inset: 0; display: grid; place-items: center; padding: 20px; background: rgba(1,4,12,.69); backdrop-filter: blur(8px); }
    .modal { width: min(460px,100%); padding: 22px; border: 1px solid rgba(186,200,255,.23); border-radius: 15px; color: var(--ink); background: #141c37; box-shadow: 0 22px 90px rgba(0,0,0,.55); }
    .modal h2 { margin: 0 0 4px; font-size: 18px; }.modal p { margin: 0 0 16px; color: var(--muted); }.modal label { display: block; margin: 12px 0 5px; color: #c4cdec; font-size: 11px; font-weight: 650; }
    .modal input,.modal select { width: 100%; padding: 9px 10px; color: white; background: #0d1329; border: 1px solid rgba(188,201,255,.21); border-radius: 7px; outline: 0; }.modal input:focus,.modal select:focus { border-color: var(--cyan); box-shadow: 0 0 0 3px rgba(83,213,255,.12); }
    .modal-foot { display: flex; justify-content: flex-end; gap: 7px; margin-top: 20px; }.modal-foot .danger { margin-right: auto; }.modal-button { padding: 8px 11px; border-radius: 7px; border: 1px solid rgba(255,255,255,.17); color: white; background: rgba(255,255,255,.08); }.modal-button.primary { border-color: #7c83ff; background: #666ee9; }.modal-button.danger { color: #ffdce3; border-color: rgba(255,107,134,.48); background: rgba(255,107,134,.12); }
    @media (max-width: 1250px) { :root { --nav: 230px; } .pane-top { align-items: flex-start; flex-direction: column; gap: 8px; }.actions { justify-content: flex-start; }.pane-identity { min-width: 0; }.pane-title,.pane-subtitle { max-width: 170px; } }
  </style>
</head>
<body>
  <aside class="sidebar">
    <div class="brand"><div class="brand-mark"><span class="spark">S</span> Slack Launcher</div><button class="split-toggle" id="split-toggle" title="Show two independent Slack sessions">Split</button></div>
    <div class="sidebar-scroll"><p class="helper" id="sidebar-helper">Choose an account to launch its isolated Slack session.</p><div class="compare-tools" id="compare-tools" hidden></div><div id="workspace-list"></div><button class="add-workspace" id="add-workspace">+ Add workspace</button></div>
  </aside>
  <main class="app"><section class="panes" id="panes"></section></main>
  <div class="toast" id="toast"></div>

  <script>
  const COLORS = ['#53d5ff','#a78bfa','#62e6a7','#ffb86b','#ff82b5','#78a8ff'];
  const DEFAULT_WORKSPACES = [
    { id: 'testgrid', name: 'Test Grid', color: '#62e6a7', type: 'grid', orgId: 'E06P7UNEKML', domain: 'thetestingworkspace1', teamId: '', accounts: [{id:'tg-po',role:'Primary Owner',email:''},{id:'tg-owner',role:'Owner',email:''},{id:'tg-admin',role:'Admin',email:''},{id:'tg-member',role:'Member',email:''},{id:'tg-mcg',role:'Multi-Channel Guest',email:''},{id:'tg-scg',role:'Single-Channel Guest',email:''}] },
    { id: 'plus', name: 'Plus Workspace', color: '#a78bfa', type: 'standalone', teamId: 'TVAD4EJ6A', orgId: '', domain: 'plus-workspace-group', accounts: [{id:'plus-po',role:'Primary Owner',email:''},{id:'plus-owner',role:'Owner',email:''},{id:'plus-admin',role:'Admin',email:''},{id:'plus-member',role:'Member',email:''},{id:'plus-mcg',role:'Multi-Channel Guest',email:''},{id:'plus-scg',role:'Single-Channel Guest',email:''}] }
  ];
  let workspaces = readStore('sl_workspaces', DEFAULT_WORKSPACES);
  let split = false;
  let focused = 'left';
  let panes = { left: null, right: null };
  const webviews = { left: null, right: null };
  const USER_AGENT = window.electronAPI.chromeUserAgent;

  function readStore(key, fallback) { try { const value = JSON.parse(localStorage.getItem(key)); return Array.isArray(value) && value.length ? value : structuredClone(fallback); } catch { return structuredClone(fallback); } }
  function save() { localStorage.setItem('sl_workspaces', JSON.stringify(workspaces)); }
  function ws(id) { return workspaces.find(item => item.id === id); }
  function account(workspace, id) { return workspace?.accounts.find(item => item.id === id); }
  function escape(value = '') { const node = document.createElement('span'); node.textContent = value; return node.innerHTML; }
  function uid() { return `${Date.now().toString(36)}${Math.random().toString(36).slice(2,7)}`; }
  function toast(message) { const node = document.getElementById('toast'); node.textContent = message; node.classList.add('show'); clearTimeout(toast.timer); toast.timer = setTimeout(() => node.classList.remove('show'), 2600); }

  function pagesFor(workspace) {
    const domain = `https://${workspace.domain}.slack.com`;
    if (workspace.type === 'grid') {
      const org = workspace.orgId || workspace.teamId;
      return [
        {label:'Home', group:'Core', url:`https://app.slack.com/client/${org}`},
        {label:'Org dashboard', group:'Organization', url:`https://app.slack.com/manage/${org}`},
        {label:'Org people', group:'Organization', url:`https://app.slack.com/manage/${org}/people`},
        {label:'Org channels', group:'Organization', url:`https://app.slack.com/manage/${org}/channels`},
        {label:'Org permissions', group:'Organization', url:`https://app.slack.com/manage/${org}/people/permissions/account-types`},
        {label:'Slack Connect', group:'Organization', url:`https://app.slack.com/manage/${org}/slack-connect/settings/channels`},
        {label:'Audit logs', group:'Organization', url:`https://app.slack.com/manage/${org}/security/audit-logs`},
        {label:'Workspace admin', group:'Workspace', url:`${domain}/admin`},
        {label:'Workspace settings', group:'Workspace', url:`${domain}/admin/settings`},
        {label:'Workspace permissions', group:'Workspace', url:`${domain}/admin/settings#permissions`},
        {label:'Workspace analytics', group:'Workspace', url:`${domain}/admin/stats`}
      ];
    }
    const team = workspace.teamId;
    return [
      {label:'Home', group:'Core', url: team ? `https://app.slack.com/client/${team}` : domain},
      {label:'Members', group:'Workspace', url:`${domain}/admin`},
      {label:'Settings', group:'Workspace', url:`${domain}/admin/settings`},
      {label:'Permissions', group:'Workspace', url:`${domain}/admin/settings#permissions`},
      {label:'Slack Connect', group:'Workspace', url:`${domain}/admin/settings#shared_channels_permissions`},
      {label:'Channels', group:'Workspace', url:`${domain}/admin/manage-channels`},
      {label:'Analytics', group:'Workspace', url:`${domain}/admin/stats`}
    ];
  }

  function buildLayout() {
    const root = document.getElementById('panes'); root.innerHTML = '';
    root.appendChild(buildPane('left'));
    if (split) root.appendChild(buildPane('right'));
    ['left','right'].forEach(side => { if (split || side === 'left') refreshPane(side); });
  }
  function buildPane(side) {
    const el = document.createElement('section'); el.className = 'pane'; el.id = `pane-${side}`; el.style.setProperty('--pane-color', side === 'left' ? '#53d5ff' : '#a78bfa');
    el.innerHTML = `<div class="pane-top" id="top-${side}"></div><nav class="page-strip" id="pages-${side}"></nav><div class="content" id="content-${side}"></div>`;
    el.addEventListener('mousedown', () => { focused = side; updateFocus(); renderSidebar(); });
    return el;
  }
  function updateFocus() { document.querySelectorAll('.pane').forEach(node => node.classList.toggle('focused', node.id === `pane-${focused}`)); }
  function refreshPane(side) {
    const pane = panes[side]; const top = document.getElementById(`top-${side}`); const pageNav = document.getElementById(`pages-${side}`); const content = document.getElementById(`content-${side}`); if (!top || !pageNav || !content) return;
    if (!pane) {
      const label = split ? (side === 'left' ? 'Pane A' : 'Pane B') : 'Slack Launcher';
      top.innerHTML = `<div class="pane-identity"><div class="pane-label">${label}</div><div class="pane-title">Ready when you are</div><div class="pane-subtitle">Choose an account from the left</div></div>`;
      pageNav.innerHTML = ''; content.innerHTML = `<div class="empty"><strong>${split ? `${label} is empty` : 'Your Slack workbench'}</strong><span>${split ? 'Select an account to load it here.' : 'Every account gets its own private Slack session.'}</span></div>`; return;
    }
    const workspace = ws(pane.workspaceId); const acc = account(workspace, pane.accountId); const pages = pagesFor(workspace); const active = pages[pane.pageIndex] || pages[0];
    top.innerHTML = `<div class="pane-identity"><div class="pane-label">${split ? (side === 'left' ? 'Pane A' : 'Pane B') : 'Active session'}</div><div class="pane-title">${escape(workspace.name)} · ${escape(acc.role)}</div><div class="pane-subtitle">${escape(acc.email || 'Email not saved')} · ${workspace.type === 'grid' ? 'Enterprise Grid' : 'Standalone'}</div></div><div class="actions"><button class="action mc" data-mc="account">MC account</button><button class="action mc" data-mc="audit">MC audit</button><button class="action mc" data-mc="user-prefs">User prefs</button><button class="action mc" data-mc="workspace-prefs">Workspace prefs</button><button class="action reset" data-reset>Reset</button></div>`;
    top.querySelectorAll('[data-mc]').forEach(button => button.onclick = () => openMc(side, button.dataset.mc)); top.querySelector('[data-reset]').onclick = () => confirmReset(side);
    pageNav.innerHTML = ''; let previousGroup = '';
    pages.forEach((page, index) => { if (previousGroup && previousGroup !== page.group) pageNav.insertAdjacentHTML('beforeend','<span class="page-separator"></span>'); previousGroup = page.group; const button = document.createElement('button'); button.className = `page${index === pane.pageIndex ? ' active' : ''}`; button.textContent = page.label; button.title = `${page.group}: ${page.label}`; button.onclick = () => navigate(side,index); pageNav.appendChild(button); });
    if (!webviews[side] || webviews[side].accountId !== pane.accountId) createWebview(side, active.url); else { const view = webviews[side].element; if (view.parentElement !== content) { content.innerHTML = ''; content.appendChild(view); } }
  }
  function createWebview(side, url) {
    const pane = panes[side]; const content = document.getElementById(`content-${side}`); if (webviews[side]?.element) webviews[side].element.remove(); content.innerHTML = '';
    const view = document.createElement('webview'); view.setAttribute('partition', `persist:slack-${pane.accountId}`); view.setAttribute('useragent', USER_AGENT); view.setAttribute('preload', window.electronAPI.webviewPreloadPath); view.setAttribute('allowpopups',''); view.src = url;
    view.addEventListener('dom-ready', () => captureAccountEmail(side)); view.addEventListener('did-fail-load', event => { if (event.errorCode !== -3) toast(`Slack could not load: ${event.errorDescription}`); });
    content.appendChild(view); webviews[side] = {accountId:pane.accountId, element:view};
  }
  function navigate(side, pageIndex) { const pane = panes[side]; if (!pane) return; pane.pageIndex = pageIndex; const url = pagesFor(ws(pane.workspaceId))[pageIndex].url; const view = webviews[side]?.element; if (view) view.loadURL(url); refreshPane(side); }

  function renderSidebar() {
    const list = document.getElementById('workspace-list'); list.innerHTML = '';
    document.getElementById('sidebar-helper').textContent = split ? 'Use the A or B button beside any account to place it exactly where you want it.' : 'Choose an account to launch its isolated Slack session.';
    renderCompareTools();
    workspaces.forEach(workspace => {
      const section = document.createElement('section'); section.className='workspace'; section.style.setProperty('--workspace-color',workspace.color);
      section.innerHTML = `<div class="workspace-head"><span class="dot" style="color:${workspace.color};background:${workspace.color}"></span><span class="workspace-name">${escape(workspace.name)}</span><span class="type">${workspace.type === 'grid' ? 'Grid' : 'WS'}</span><button class="icon-button" title="Edit workspace">⚙</button></div><div class="accounts"></div>`;
      section.querySelector('.icon-button').onclick = () => workspaceModal(workspace); const accounts = section.querySelector('.accounts');
      workspace.accounts.forEach(acc => { const row = document.createElement('div'); row.className='account-row'; const inA = panes.left?.accountId === acc.id; const inB = panes.right?.accountId === acc.id; const selected = inA || inB; const lanes = split ? `<span class="lane-buttons"><button class="lane-button a${inA ? ' occupied' : ''}" title="Load into Pane A">A</button><button class="lane-button b${inB ? ' occupied' : ''}" title="Load into Pane B">B</button></span>` : ''; row.innerHTML = `<button class="account${selected ? ' selected':''}" title="Load into the currently active pane"><span class="pane-dot"></span><span class="account-name">${escape(acc.role)}</span></button>${lanes}<button class="icon-button copy" title="${acc.email ? `Copy ${acc.email}` : 'Add an email in account settings'}">⌑</button><button class="icon-button edit" title="Edit account">⋯</button>`; row.querySelector('.account').onclick=()=>selectAccount(workspace.id,acc.id,split?focused:'left'); row.querySelector('.lane-button.a')?.addEventListener('click',()=>selectAccount(workspace.id,acc.id,'left')); row.querySelector('.lane-button.b')?.addEventListener('click',()=>selectAccount(workspace.id,acc.id,'right')); row.querySelector('.copy').onclick=()=>copyEmail(acc); row.querySelector('.edit').onclick=()=>accountModal(workspace,acc); accounts.appendChild(row); });
      const add = document.createElement('button'); add.className='add-row'; add.textContent='+ Add account'; add.onclick=()=>accountModal(workspace); accounts.appendChild(add); list.appendChild(section);
    });
  }
  function renderCompareTools() {
    const tools = document.getElementById('compare-tools');
    tools.hidden = !split;
    if (!split) { tools.innerHTML = ''; return; }
    tools.innerHTML = `<button data-mirror ${panes.left ? '' : 'disabled'} title="Open the Pane A account in Pane B">Mirror A → B</button><button data-swap ${panes.left && panes.right ? '' : 'disabled'} title="Exchange the two pane sessions">Swap A ↔ B</button>`;
    tools.querySelector('[data-mirror]').onclick = () => { if (!panes.left) return; panes.right = {...panes.left}; focused = 'right'; refreshPane('right'); updateFocus(); renderSidebar(); };
    tools.querySelector('[data-swap]').onclick = () => { if (!panes.left || !panes.right) return; [panes.left, panes.right] = [panes.right, panes.left]; [webviews.left, webviews.right] = [webviews.right, webviews.left]; refreshPane('left'); refreshPane('right'); renderSidebar(); };
  }
  function selectAccount(workspaceId, accountId, side) { panes[side] = {workspaceId,accountId,pageIndex:0}; focused=side; refreshPane(side); updateFocus(); renderSidebar(); }
  async function copyEmail(acc) { if (!acc.email) return toast('Add this account’s email first; then it can be copied even while signed out.'); try { await navigator.clipboard.writeText(acc.email); toast(`Copied ${acc.email}`); } catch { toast('Could not access the clipboard.'); } }

  const ALPHABET = '0123456789ABCDEFGHJKLMNPQRSTUVWXYZ';
  function rawSlackId(encoded) { const text = String(encoded || '').trim().toUpperCase(); const digits = text.replace(/^[A-Z]/,''); if (!digits || digits.length % 2) return ''; let raw = 0; for (let i=0;i<digits.length;i+=2) { const high=ALPHABET.indexOf(digits[i]), low=ALPHABET.indexOf(digits[i+1]); if (high < 0 || low < 0) return ''; raw = raw * 1000 + high * 34 + low; } return String(raw); }
  async function identityFor(side) {
    const pane=panes[side], workspace=ws(pane?.workspaceId), view=webviews[side]?.element; if (!pane || !view) throw new Error('Load an account first.');
    const discovered = await view.executeJavaScript(`(() => { const sources=[window.boot_data,window.TS&&window.TS.boot_data,window.__boot_data]; let userId='',teamId='',email=''; for (const s of sources) { if (!s) continue; userId ||= s.user_id || s.userId || s.user?.id || ''; teamId ||= s.team_id || s.teamId || s.team?.id || ''; email ||= s.email || s.user_email || s.user?.email || ''; } if (!teamId) { const match=location.pathname.match(/\\/client\\/([TE][A-Z0-9]+)/i); teamId=match?.[1]||''; } try { for (let i=0;i<localStorage.length && (!userId || !teamId);i++) { const value=localStorage.getItem(localStorage.key(i))||''; if (value.length>750000) continue; userId ||= value.match(/["']user_id["']\\s*[:=]\\s*["'](U[A-Z0-9]+)["']/i)?.[1]||''; teamId ||= value.match(/["']team_id["']\\s*[:=]\\s*["'](T[A-Z0-9]+)["']/i)?.[1]||''; } } catch {} return {userId,teamId,email}; })()`);
    return { user: rawSlackId(discovered.userId), team: rawSlackId(discovered.teamId || workspace.teamId), email: discovered.email };
  }
  async function openMc(side, type) {
    try { const ids=await identityFor(side); const requiresUser=type==='account'||type==='user-prefs'; if ((requiresUser&&!ids.user)||!ids.team) throw new Error('Slack has not exposed this account’s identity yet. Finish loading Slack and try again.'); const base='https://mc.tinyspeck.com/mc/'; const url= type==='account' ? `${base}user.php?id=${ids.user}&team_id=${ids.team}` : type==='audit' ? `${base}external_audit_logs.php?id=${ids.team}` : type==='user-prefs' ? `${base}user_prefs.php?id=${ids.user}&team_id=${ids.team}` : `${base}team_prefs.php?id=${ids.team}`; await window.electronAPI.openExternal(url); toast('Opened authenticated MC page in your browser.'); } catch (error) { toast(error.message || 'Could not open MC.'); } }
  function confirmReset(side) { const pane=panes[side], workspace=ws(pane?.workspaceId), acc=account(workspace,pane?.accountId); if (!pane) return; modal(`<h2>Reset ${escape(acc.role)}?</h2><p>This will leave channels, close DMs and group DMs, and delete drafts for this Slack account. General and channels Slack will not allow it to leave are preserved.</p><div class="modal-foot"><button class="modal-button" data-close>Cancel</button><button class="modal-button danger" data-confirm>Reset this account</button></div>`, node => node.querySelector('[data-confirm]').onclick=()=>{closeModal(); resetAccount(side);}); }
  async function resetAccount(side) {
    const view=webviews[side]?.element; if (!view) return; toast('Resetting account…');
    try { const result=await view.executeJavaScript(`(async()=>{let token=window.boot_data?.api_token||window.TS?.boot_data?.api_token||''; if(!token){try{for(let i=0;i<localStorage.length;i++){const value=localStorage.getItem(localStorage.key(i))||'';const match=value.match(/xoxc-[A-Za-z0-9._-]+/);if(match){token=match[0];break;}}}catch{}} if(!token)return {error:'Slack session token not available yet'}; const call=async(method,params={})=>{const form=new URLSearchParams({token,...params});const response=await fetch('/api/'+method,{method:'POST',body:form,credentials:'include'});return response.json();}; const counts=await call('client.counts');if(!counts.ok)return {error:counts.error||'Could not read Slack conversations'};let left=0,closed=0,drafts=0; for(const draft of (await call('drafts.list')).drafts||[]){if(!draft.is_deleted&&(await call('drafts.delete',{draft_id:draft.id,client_last_updated_ts:String(Date.now()/1000)})).ok)drafts++;} for(const channel of counts.channels||[]){const reply=await call('conversations.leave',{channel:channel.id});if(reply.ok)left++;} for(const conversation of [...(counts.ims||[]),...(counts.mpims||[])]){const reply=await call('conversations.close',{channel:conversation.id});if(reply.ok||reply.already_closed)closed++;}return {left,closed,drafts};})()`); if(result.error) throw new Error(result.error); view.reload(); toast(`Reset complete: left ${result.left} channels, closed ${result.closed} conversations, deleted ${result.drafts} drafts.`); } catch (error) { toast(`Reset failed: ${error.message || error}`); } }
  async function captureAccountEmail(side) { try { const pane=panes[side], found=await identityFor(side); const acc=account(ws(pane.workspaceId),pane.accountId); if (found.email && !acc.email) { acc.email=found.email; save(); renderSidebar(); refreshPane(side); } } catch {} }

  function modal(html, setup=()=>{}) { const wrap=document.createElement('div'); wrap.className='modal-wrap'; wrap.innerHTML=`<div class="modal">${html}</div>`; wrap.addEventListener('mousedown',e=>{if(e.target===wrap)closeModal();}); document.body.appendChild(wrap); wrap.querySelector('[data-close]')?.addEventListener('click',closeModal); setup(wrap); }
  function closeModal() { document.querySelector('.modal-wrap')?.remove(); }
  function workspaceModal(existing) { const item=existing||{name:'',domain:'',type:'standalone',orgId:'',teamId:''}; modal(`<h2>${existing?'Edit':'Add'} workspace</h2><p>Use the Slack subdomain and IDs from the workspace you want to open.</p><label>Name</label><input data-name value="${escape(item.name)}" placeholder="My workspace"><label>Slack subdomain</label><input data-domain value="${escape(item.domain)}" placeholder="my-workspace"><label>Workspace type</label><select data-type><option value="standalone">Standalone workspace</option><option value="grid">Enterprise Grid</option></select><label>Workspace team ID <span style="color:#9ca8c7">(T…; recommended)</span></label><input data-team value="${escape(item.teamId)}" placeholder="T0123456789"><label>Grid organization ID <span style="color:#9ca8c7">(E…; Grid only)</span></label><input data-org value="${escape(item.orgId)}" placeholder="E0123456789"><div class="modal-foot">${existing?'<button class="modal-button danger" data-delete>Delete</button>':''}<button class="modal-button" data-close>Cancel</button><button class="modal-button primary" data-save>Save workspace</button></div>`, node=>{node.querySelector('[data-type]').value=item.type; node.querySelector('[data-save]').onclick=()=>{const name=node.querySelector('[data-name]').value.trim(), domain=node.querySelector('[data-domain]').value.trim().replace(/^https?:\/\//,'').replace(/\.slack\.com.*$/,'');if(!name||!domain)return toast('A name and Slack subdomain are required.');const next={...item,name,domain,type:node.querySelector('[data-type]').value,teamId:node.querySelector('[data-team]').value.trim().toUpperCase(),orgId:node.querySelector('[data-org]').value.trim().toUpperCase()};if(existing)Object.assign(existing,next);else workspaces.push({...next,id:'ws-'+uid(),color:COLORS[workspaces.length%COLORS.length],accounts:[]});save();closeModal();renderSidebar();['left','right'].forEach(refreshPane);};node.querySelector('[data-delete]')?.addEventListener('click',()=>{workspaces=workspaces.filter(x=>x!==existing);['left','right'].forEach(side=>{if(panes[side]?.workspaceId===existing.id)panes[side]=null;});save();closeModal();buildLayout();renderSidebar();});}); }
  function accountModal(workspace, existing) { const item=existing||{role:'',email:''}; modal(`<h2>${existing?'Edit':'Add'} account</h2><p>The saved email makes the copy button work before the account is signed in.</p><label>Account label</label><input data-role value="${escape(item.role)}" placeholder="Primary Owner"><label>Email address</label><input data-email type="email" value="${escape(item.email)}" placeholder="person@example.com"><div class="modal-foot">${existing?'<button class="modal-button danger" data-delete>Delete</button>':''}<button class="modal-button" data-close>Cancel</button><button class="modal-button primary" data-save>Save account</button></div>`, node=>{node.querySelector('[data-save]').onclick=()=>{const role=node.querySelector('[data-role]').value.trim(),email=node.querySelector('[data-email]').value.trim();if(!role)return toast('An account label is required.');const next={...item,role,email};if(existing)Object.assign(existing,next);else workspace.accounts.push({...next,id:`acc-${uid()}`});save();closeModal();renderSidebar();['left','right'].forEach(refreshPane);};node.querySelector('[data-delete]')?.addEventListener('click',()=>{workspace.accounts=workspace.accounts.filter(x=>x!==existing);['left','right'].forEach(side=>{if(panes[side]?.accountId===existing.id)panes[side]=null;});save();closeModal();buildLayout();renderSidebar();});}); }
  document.getElementById('add-workspace').onclick=()=>workspaceModal();
  document.getElementById('split-toggle').onclick=()=>{split=!split; if(!split)panes.right=null; document.getElementById('split-toggle').classList.toggle('active',split); buildLayout();renderSidebar();};
  window.electronAPI.onSlackNewWindow(url=>{const side=focused; const view=webviews[side]?.element; if(view && /^https:\/\/(app|[^/]+\.slack)\.slack\.com|https:\/\/[^/]+\.slack\.com/i.test(url)) view.loadURL(url); else window.electronAPI.openExternal(url);});
  buildLayout(); renderSidebar();
  </script>
</body>
</html>
